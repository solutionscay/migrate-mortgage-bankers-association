<tr id="door-{{ uuid }}"><td class="num">{{ number }}</td><td class="door-who"><b>{{ name }}</b><span class="sub">{{ company }}</span></td><td class="num">{{ guests }}</td><td class="door-cell"><form method="post" action="/registrations/{{ uuid }}/attendance" hx-post="/registrations/{{ uuid }}/attendance" hx-target="closest tr" hx-swap="outerHTML"><input type="hidden" name="_csrf" value="{{ csrf }}"><span class="seg door-seg" role="group" aria-label="Estatus en puerta de #{{ number }}"><button class="btn door-btn door-ok" type="submit" name="status" value="Asistió" aria-pressed="{{ self.on("Asistió") }}">Asistió</button><button class="btn door-btn door-no" type="submit" name="status" value="No Asistió" aria-pressed="{{ self.on("No Asistió") }}">No Asistió</button><button class="btn door-btn door-cancel" type="submit" name="status" value="Canceló" aria-pressed="{{ self.on("Canceló") }}">Canceló</button></span></form></td></tr>

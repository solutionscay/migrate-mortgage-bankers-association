{#- "Costeado por" (registration.costeado_por): two radios, each autosaves its value. -#}
<div class="field-wrap radios" role="radiogroup" aria-labelledby="r-cp"{% if error.is_some() %} data-unsaved{% endif %}><label class="check"><input type="radio" name="costeado_por" value="Afiliado"{% if saved == "Afiliado" %} checked data-saved="on"{% else %} data-saved="off"{% endif %} hx-patch="{{ url }}" hx-trigger="change" hx-target="closest .field-wrap" hx-swap="outerHTML"> Afiliado</label><label class="check"><input type="radio" name="costeado_por" value="Individuo"{% if saved == "Individuo" %} checked data-saved="on"{% else %} data-saved="off"{% endif %} hx-patch="{{ url }}" hx-trigger="change" hx-target="closest .field-wrap" hx-swap="outerHTML"> Individuo</label>{% if let Some(e) = error %}<div class="field-error"><svg class="i i-sm"><use href="#i-alert"/></svg>{{ e }}</div>{% endif %}</div>

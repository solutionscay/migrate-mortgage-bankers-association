<tbody id="pi-{{ it.uuid }}"><tr class="{% if it.active %}plan-on{% else %}plan-off{% endif %}"{% if it.error.is_some() %} data-unsaved{% endif %}><td class="c"><label class="check"><input type="checkbox"{% if it.active %} checked{% endif %} aria-label="Incluir {{ it.name }}" hx-patch="/plan-items/{{ it.uuid }}" hx-vals='{"active": "{% if it.active %}0{% else %}1{% endif %}"}' hx-trigger="change" hx-target="closest tbody" hx-swap="outerHTML"></label></td><td>{{ it.kind }}</td><td>{{ it.name }}</td><td class="{% if it.room.is_empty() %}muted{% endif %}">{% if it.room.is_empty() %}—{% else %}{{ it.room }}{% endif %}</td><td>{{ it.start }}</td><td>{{ it.time_start }}</td><td>{{ it.end }}</td><td>{{ it.time_end }}</td><td class="edit"><input class="field num" type="number" min="1" max="999" value="{{ self.qty_value() }}" aria-label="Qty. {{ it.name }}" name="ticket_qty" data-saved="{{ it.qty }}" hx-patch="/plan-items/{{ it.uuid }}" hx-trigger="change" hx-target="closest tbody" hx-swap="outerHTML"{% if it.error.is_some() %} aria-invalid="true" aria-describedby="pe-{{ it.uuid }}"{% endif %}></td><td class="money">{{ self.usd(it.price) }}</td><td class="col-act"><button class="row-act" type="button" data-menu="menu-pi-{{ it.uuid }}" aria-label="Acciones de la fila" aria-haspopup="menu" aria-expanded="false"><svg class="i"><use href="#i-more"/></svg></button>
<div class="menu" id="menu-pi-{{ it.uuid }}" popover role="menu">
  <button type="button" role="menuitem" hx-patch="/plan-items/{{ it.uuid }}" hx-vals='{"active": "{% if it.active %}0{% else %}1{% endif %}"}' hx-target="#pi-{{ it.uuid }}" hx-swap="outerHTML" popovertarget="menu-pi-{{ it.uuid }}" popovertargetaction="hide"><svg class="i"><use href="#i-check"/></svg>{% if it.active %}Excluir{% else %}Incluir{% endif %}</button>
  <hr>
  <button type="button" role="menuitem" class="danger act-remove" data-open="dlg-quitar-{{ it.uuid }}"><svg class="i"><use href="#i-trash"/></svg>Quitar del plan…</button>
</div></td></tr>
{%- if let Some(e) = it.error %}
<tr class="row-error" role="alert"><td colspan="11"><span id="pe-{{ it.uuid }}"><svg class="i i-sm"><use href="#i-alert"/></svg> Qty. de {{ it.name }}: {{ e }} Pulse Esc para volver al valor guardado.</span></td></tr>
{%- endif %}
</tbody>

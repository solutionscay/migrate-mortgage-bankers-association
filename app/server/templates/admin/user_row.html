<tr id="u-{{ u.id }}"{% if !u.active %} class="ma-off"{% endif %}><td class="strong">{{ u.username }}</td><td>{{ u.display_name }}</td><td>{% if u.role == "admin" %}<span class="tag info">ROLE-ADMIN</span>{% else %}<span class="tag plain">ROLE-STAFF</span>{% endif %}</td><td>{% if u.active %}<span class="tag ok">Activo</span>{% else %}<span class="tag">Inactivo</span>{% endif %}</td><td class="num">{% if let Some(l) = u.locked_until %}<span class="tag warn">{{ l }}</span>{% else %}<span class="muted">—</span>{% endif %}</td><td class="num">{% if let Some(l) = u.last_login %}{{ l }}{% else %}<span class="muted">—</span>{% endif %}</td><td class="col-act"><button class="row-act" type="button" id="act-{{ u.id }}" data-menu="menu-u-{{ u.id }}" aria-label="Acciones de {{ u.username }}" aria-haspopup="menu" aria-expanded="false"><svg class="i"><use href="#i-more"/></svg></button></td></tr>

<tr id="u-{{ u.id }}"><td class="strong">{{ u.username }}</td><td class="edit">{{ name.html()|safe }}</td><td class="edit">{{ role.html()|safe }}</td><td class="edit">{{ active.html()|safe }}</td><td class="num">{% if let Some(l) = u.locked_until %}<span class="tag warn">{{ l }}</span>{% else %}<span class="muted">—</span>{% endif %}</td><td class="num">{% if let Some(l) = u.last_login %}{{ l }}{% else %}<span class="muted">—</span>{% endif %}</td><td class="col-act"><button class="row-act" type="button" hx-get="/admin/users/{{ u.id }}?vista=fila" hx-target="closest tr" hx-swap="outerHTML" aria-label="Terminar edición de {{ u.username }}" title="Listo"><svg class="i"><use href="#i-check"/></svg></button></td></tr>
